name: Backend security checks
on:
  push:
    branches: [main]
    paths: ['backend/**', 'scripts/check-web-keys*', '.github/workflows/backend_security.yml']
  pull_request:
    paths: ['backend/**', 'scripts/check-web-keys*', '.github/workflows/backend_security.yml']
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
        working-directory: backend
      - run: npm test
        working-directory: backend
      - run: node --test scripts/check-web-keys.test.mjs
